<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #87CEEB;
    --grass: #4CAF50;
    --grass-dark: #388E3C;
    --dirt: #8B5E3C;
    --dirt-dark: #6D4C2E;
    --mole-body: #7B4F2A;
    --mole-face: #A0714F;
    --mole-nose: #E57373;
    --hole: #3E2723;
    --yellow: #FFD600;
    --orange: #FF8C00;
    --red: #E53935;
    --white: #fff;
    --shadow: rgba(0,0,0,0.18);
  }

  html, body {
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #b8e8ff 0%, #87CEEB 40%, #6ec6e0 100%);
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* Clouds */
  .cloud {
    position: fixed;
    background: #fff;
    border-radius: 50px;
    opacity: 0.85;
    animation: floatCloud linear infinite;
    z-index: 1;
  }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud1 { width: 120px; height: 40px; top: 8%; left: -140px; animation-duration: 28s; }
  .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud1::after  { width: 40px; height: 40px; top: -18px; left: 60px; }
  .cloud2 { width: 90px; height: 30px; top: 18%; left: -120px; animation-duration: 36s; animation-delay: -12s; }
  .cloud2::before { width: 45px; height: 45px; top: -22px; left: 15px; }
  .cloud2::after  { width: 30px; height: 30px; top: -14px; left: 50px; }
  @keyframes floatCloud { from { left: -200px; } to { left: 110vw; } }

  /* Sun */
  .sun {
    position: fixed; top: 28px; right: 60px; width: 70px; height: 70px;
    background: radial-gradient(circle, #FFE066 60%, #FFD600 100%);
    border-radius: 50%; box-shadow: 0 0 40px 15px rgba(255,214,0,0.35);
    animation: sunPulse 3s ease-in-out infinite; z-index: 1;
  }
  @keyframes sunPulse { 0%,100%{ box-shadow: 0 0 40px 15px rgba(255,214,0,0.35); } 50%{ box-shadow: 0 0 60px 28px rgba(255,214,0,0.55); } }

  /* Mountains */
  .mountains {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 40vh;
    z-index: 0; pointer-events: none;
  }
  .mtn { position: absolute; bottom: 0; width: 0; height: 0; border-style: solid; }
  .mtn1 { border-width: 0 40vw 25vh transparent; border-color: transparent transparent #6B8E23 transparent; left: -10vw; }
  .mtn2 { border-width: 0 35vw 35vh transparent; border-color: transparent transparent #556B2F transparent; left: 20vw; }
  .mtn3 { border-width: 0 45vw 20vh transparent; border-color: transparent transparent #8FBC8F transparent; left: 50vw; }

  /* Bugs & Flowers floating */
  .floater {
    position: fixed; font-size: 1.5rem; z-index: 2; pointer-events: none;
    animation: floatBug linear infinite;
  }
  .butterfly { animation-name: floatButterfly; }
  .bee { animation-name: floatBee; font-size: 1.2rem; }
  @keyframes floatButterfly {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate(40vw, -10vh) rotate(5deg); }
    90%  { opacity: 1; }
    100% { transform: translate(90vw, -5vh) rotate(-5deg); opacity: 0; }
  }
  @keyframes floatBee {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: 1; }
    25%  { transform: translate(15vw, 5vh); }
    50%  { transform: translate(30vw, -5vh); }
    75%  { transform: translate(45vw, 5vh); }
    90%  { opacity: 1; }
    100% { transform: translate(60vw, 0); opacity: 0; }
  }

  /* Wrapper */
  #wrapper {
    position: relative; width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    z-index: 10;
  }

  /* Header */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 750px; padding: 18px 24px 0; gap: 10px; flex-wrap: wrap;
  }
  #title { font-family: 'Fredoka One', cursive; font-size: 2rem; color: #4E2800; text-shadow: 3px 3px 0 #FFD600; }
  .stat-box {
    background: rgba(255,255,255,0.7); border: 3px solid rgba(78,40,0,0.2);
    border-radius: 16px; padding: 6px 14px; text-align: center; backdrop-filter: blur(4px); min-width: 70px;
  }
  .stat-label { font-size: 10px; font-weight: 700; color: #8B5E3C; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: #4E2800; line-height: 1.1; transition: transform 0.1s; }
  .stat-value.pop { animation: statPop 0.25s ease; }
  @keyframes statPop { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }

  /* Timer bar */
  #timer-wrap { width: 100%; max-width: 750px; padding: 10px 24px 0; }
  #timer-bar-bg { width: 100%; height: 14px; background: rgba(255,255,255,0.45); border-radius: 20px; border: 2px solid rgba(78,40,0,0.18); overflow: hidden; }
  #timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #4CAF50, #FFD600, #FF8C00); border-radius: 20px; transition: width 0.1s linear, background 0.4s; }

  /* Grass ground */
  #ground {
    position: relative; width: 100%; max-width: 750px; margin-top: 14px;
    background: linear-gradient(180deg, #66BB6A 0%, #4CAF50 30%, #388E3C 100%);
    border-radius: 24px 24px 0 0; padding: 28px 24px 40px; flex: 1;
    box-shadow: 0 -6px 0 #FFD600, 0 0 0 6px rgba(0,0,0,0.07); overflow: visible;
  }
  #ground::before {
    content:''; position: absolute; top: -13px; left: 0; right: 0; height: 24px;
    background: radial-gradient(ellipse 18px 18px at 50% 100%, #66BB6A 80%, transparent 100%);
    background-size: 36px 24px; background-repeat: repeat-x;
  }
  /* Ground Flowers */
  .ground-flower { position: absolute; font-size: 1.2rem; bottom: 10px; pointer-events: none; z-index: 0; }

  /* Holes grid */
  #holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 16px; width: 100%; max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
  
  /* Hole Structure */
  .hole-wrap { display: flex; flex-direction: column; align-items: center; position: relative; cursor: crosshair; }
  .hole-scene { position: relative; width: 100%; max-width: 170px; height: 110px; }
  .dirt-mound { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 90%; height: 55px; background: radial-gradient(ellipse 90% 60% at 50% 70%, #8B5E3C 60%, #6D4C2E 100%); border-radius: 50% 50% 0 0; box-shadow: 0 6px 0 rgba(0,0,0,0.13); z-index: 1; }
  .hole-opening { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); width: 62%; height: 28px; background: radial-gradient(ellipse 100% 100%, #1a0a00 60%, #3E2723 100%); border-radius: 50%; z-index: 2; }
  .mole-clip { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); width: 62%; height: 80px; overflow: hidden; z-index: 3; border-radius: 40% 40% 0 0; }
  .mole { position: absolute; bottom: -85px; left: 50%; transform: translateX(-50%); width: 54px; transition: bottom 0.22s cubic-bezier(.34,1.56,.64,1); }
  .mole.up { bottom: 0px; }
  .mole.whacked { bottom: -85px !important; transition: bottom 0.08s ease-in; }
  .mole svg { width: 54px; height: 80px; display: block; overflow: visible; }
  .dirt-top { position: absolute; bottom: 23px; left: 50%; transform: translateX(-50%); width: 66%; height: 20px; background: radial-gradient(ellipse 100% 100%, #8B5E3C 70%, #6D4C2E 100%); border-radius: 50%; z-index: 4; }
  .hit-flash { position: absolute; inset: 0; border-radius: 12px; background: rgba(255,220,0,0.0); pointer-events: none; z-index: 10; transition: background 0.06s; }
  .hit-flash.flash { animation: flashAnim 0.3s ease; }
  @keyframes flashAnim { 0%{background:rgba(255,220,0,0.7)} 100%{background:rgba(255,220,0,0)} }

  /* Effects */
  .star-burst { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #FFD600; text-shadow: 2px 2px 0 #E65100; pointer-events: none; z-index: 20; animation: burstUp 0.55s ease forwards; white-space: nowrap; }
  @keyframes burstUp { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.2)} 60%{opacity:1;transform:translateX(-50%) translateY(-36px) scale(1)} 100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(0.8)} }
  .score-popup { position: fixed; font-family: 'Fredoka One', cursive; font-size: 2rem; color: #fff; text-shadow: 2px 2px 0 #E65100; pointer-events: none; z-index: 999; animation: scoreFloat 0.7s ease forwards; }
  @keyframes scoreFloat { 0%{opacity:1;transform:translateY(0) scale(1.1)} 100%{opacity:0;transform:translateY(-80px) scale(0.8)} }
  .miss-ripple { position: fixed; width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,80,80,0.7); pointer-events: none; z-index: 998; animation: rippleOut 0.4s ease forwards; transform: translate(-50%, -50%); }
  @keyframes rippleOut { 0%{opacity:1;width:30px;height:30px} 100%{opacity:0;width:80px;height:80px} }

  /* Hammer */
  body.playing { cursor: none; }
  #hammer-cursor { position: fixed; width: 48px; pointer-events: none; z-index: 9999; transform: translate(-12px, -6px) rotate(-30deg); transition: transform 0.08s; display: none; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.3)); }
  #hammer-cursor.strike { transform: translate(-12px, -6px) rotate(20deg); }
  @keyframes screenShake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,3px)} 40%{transform:translate(5px,-3px)} 60%{transform:translate(-3px,5px)} 80%{transform:translate(3px,-2px)} }
  body.shake { animation: screenShake 0.3s ease; }

  /* Combo */
  #combo-display { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: #E65100; text-shadow: 2px 2px 0 #fff; pointer-events: none; z-index: 400; opacity: 0; transition: opacity 0.3s; }
  #combo-display.show { opacity: 1; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 500; background: rgba(30,10,0,0.55); backdrop-filter: blur(6px); }
  .overlay-box { background: linear-gradient(135deg, #fff9e6, #fff3cc); border: 5px solid #FFD600; border-radius: 28px; padding: 40px 36px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1); max-width: 90vw; }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .overlay-title { font-family: 'Fredoka One', cursive; font-size: 2.5rem; color: #4E2800; text-shadow: 3px 3px 0 #FFD600; margin-bottom: 8px; }
  .overlay-sub { font-size: 1.1rem; color: #7B4F2A; margin-bottom: 16px; line-height: 1.5; }
  .big-score { font-family: 'Fredoka One', cursive; font-size: 3.5rem; color: #E65100; text-shadow: 3px 3px 0 rgba(0,0,0,0.1); margin: 10px 0 10px; }
  .btn { font-family: 'Fredoka One', cursive; font-size: 1.4rem; background: linear-gradient(135deg, #FFD600, #FF8C00); color: #4E2800; border: none; border-radius: 50px; padding: 14px 40px; cursor: pointer; box-shadow: 0 5px 0 #b85c00, 0 7px 15px rgba(0,0,0,0.18); transition: transform 0.1s, box-shadow 0.1s; letter-spacing: 1px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #b85c00, 0 10px 20px rgba(0,0,0,0.2); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b85c00; }
  
  /* Name Input & Leaderboard */
  .name-input { font-family: 'Nunito', sans-serif; font-size: 1.2rem; padding: 10px 20px; border: 3px solid #FFD600; border-radius: 50px; text-align: center; outline: none; margin-bottom: 20px; color: #4E2800; font-weight: 700; background: #fff; width: 80%; max-width: 250px; }
  .name-input::placeholder { color: #c88a50; font-weight: 400; }
  .diff-row { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
  .diff-btn { font-family: 'Fredoka One', cursive; font-size: 1rem; padding: 8px 22px; border-radius: 50px; border: 3px solid transparent; cursor: pointer; transition: all 0.15s; background: rgba(255,255,255,0.6); color: #4E2800; }
  .diff-btn.selected { background: #4E2800; color: #FFD600; border-color: #FFD600; }
  .diff-btn:hover:not(.selected) { background: rgba(255,214,0,0.3); }
  .leaderboard { margin-top: 15px; text-align: left; width: 100%; max-width: 250px; margin-left: auto; margin-right: auto; }
  .lb-title { font-family: 'Fredoka One', cursive; color: #4E2800; font-size: 1.2rem; border-bottom: 2px solid #FFD600; margin-bottom: 8px; }
  .lb-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 4px 0; color: #6D4C2E; font-weight: 700; }
  .lb-row span:last-child { color: #E65100; }
  .stats-end { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
  .stat-end-box { background: rgba(255,255,255,0.5); padding: 8px 12px; border-radius: 12px; }
  .stat-end-label { font-size: 0.8rem; color: #8B5E3C; font-weight: 700; }
  .stat-end-val { font-family: 'Fredoka One', cursive; color: #4E2800; font-size: 1.2rem; }
</style>
</head>
<body>

<!-- Background Elements -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="sun"></div>

<div class="mountains">
  <div class="mtn mtn1"></div>
  <div class="mtn mtn2"></div>
  <div class="mtn mtn3"></div>
</div>

<!-- Animated Bugs -->
<div class="floater butterfly" style="top:15%; left:-10%; animation-duration: 12s; animation-delay: 0s;">🦋</div>
<div class="floater butterfly" style="top:25%; left:-10%; animation-duration: 15s; animation-delay: -5s;">🦋</div>
<div class="floater bee" style="top:20%; left:-10%; animation-duration: 9s; animation-delay: -2s;">🐝</div>
<div class="floater bee" style="top:35%; left:-10%; animation-duration: 11s; animation-delay: -7s;">🐝</div>

<svg id="hammer-cursor" viewBox="0 0 48 80" xmlns="http://www.w3.org/2000/svg">
  <rect x="18" y="0" width="12" height="38" rx="5" fill="#8B5E3C"/>
  <rect x="4" y="10" width="40" height="22" rx="7" fill="#4E2800"/>
  <rect x="4" y="10" width="40" height="8" rx="4" fill="#6D4C2E"/>
</svg>

<div id="combo-display"></div>

<!-- START SCREEN -->
<div class="overlay" id="start-screen">
  <div class="overlay-box">
    <div class="overlay-title">🐾 Whack-a-Mole!</div>
    <div class="overlay-sub">Smash those pesky moles before they disappear!</div>
    <input type="text" id="player-name" class="name-input" placeholder="Enter your name" maxlength="12">
    <div class="diff-row">
      <button class="diff-btn" data-diff="easy">😊 Easy</button>
      <button class="diff-btn selected" data-diff="normal">😤 Normal</button>
      <button class="diff-btn" data-diff="hard">🔥 Hard</button>
    </div>
    <button class="btn" id="start-btn">▶ Start Game</button>
    
    <div class="leaderboard" id="start-lb">
      <div class="lb-title">🏆 All-Time Best</div>
      <div id="start-lb-rows"></div>
    </div>
  </div>
</div>

<!-- END SCREEN -->
<div class="overlay" id="end-screen" style="display:none">
  <div class="overlay-box">
    <div class="overlay-title" id="end-title">Time's Up!</div>
    <div class="overlay-sub" id="end-player-name"></div>
    
    <div class="big-score" id="end-score">0</div>
    
    <div class="stats-end">
      <div class="stat-end-box">
        <div class="stat-end-label">Hit Rate</div>
        <div class="stat-end-val" id="end-hitrate">0%</div>
      </div>
      <div class="stat-end-box">
        <div class="stat-end-label">Max Combo</div>
        <div class="stat-end-val" id="end-combo">0x</div>
      </div>
    </div>

    <button class="btn" id="replay-btn">🔄 Play Again</button>

    <div class="leaderboard" id="end-lb">
      <div class="lb-title">🏆 Leaderboard</div>
      <div id="end-lb-rows"></div>
    </div>
  </div>
</div>

<!-- Game -->
<div id="wrapper">
  <div id="header">
    <div id="title">🐾 Whack!</div>
    <div class="stat-box">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="score-display">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Time</div>
      <div class="stat-value" id="time-display">30</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Hit Rate</div>
      <div class="stat-value" id="hitrate-display" style="font-size:1.2rem">0%</div>
    </div>
  </div>

  <div id="timer-wrap">
    <div id="timer-bar-bg">
      <div id="timer-bar"></div>
    </div>
  </div>

  <div id="ground">
    <!-- Decorative flowers on the ground -->
    <div class="ground-flower" style="left: 5%; top: 15px;">🌻</div>
    <div class="ground-flower" style="left: 20%; top: 8px;">🌼</div>
    <div class="ground-flower" style="right: 15%; top: 12px;">🌷</div>
    <div class="ground-flower" style="right: 3%; top: 20px;">🌻</div>
    
    <div id="holes"></div>
  </div>
</div>

<script>
// --- Config ---
const HOLE_COUNT = 9;
const GAME_DURATION = 30;
const DIFF = {
  easy:   { minUp: 1200, maxUp: 2200, interval: 900,  points: 10 },
  normal: { minUp: 700,  maxUp: 1600, interval: 700,  points: 15 },
  hard:   { minUp: 400,  maxUp: 1100, interval: 550,  points: 20 }
};

let score = 0, timeLeft = GAME_DURATION, playing = false;
let moleTimers = [], tickInterval, moleInterval;
let difficulty = 'normal';
let combo = 0, maxCombo = 0, comboTimeout;
let totalClicks = 0, totalHits = 0;

// Name & Leaderboard
let playerName = localStorage.getItem('wam_name') || '';

// --- Build holes ---
const holesEl = document.getElementById('holes');
for (let i = 0; i < HOLE_COUNT; i++) {
  holesEl.innerHTML += `
  <div class="hole-wrap" id="hole-wrap-${i}">
    <div class="hole-scene" id="hole-scene-${i}">
      <div class="mole-clip">
        <div class="mole" id="mole-${i}">
          <svg viewBox="0 0 54 80" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="27" cy="58" rx="24" ry="28" fill="#7B4F2A"/>
            <ellipse cx="27" cy="60" rx="14" ry="18" fill="#A0714F"/>
            <ellipse cx="27" cy="34" rx="22" ry="20" fill="#7B4F2A"/>
            <ellipse cx="27" cy="36" rx="16" ry="14" fill="#A0714F"/>
            <ellipse cx="20" cy="30" rx="5" ry="5.5" fill="#fff"/>
            <ellipse cx="34" cy="30" rx="5" ry="5.5" fill="#fff"/>
            <circle cx="21" cy="31" r="3" fill="#1a0a00"/>
            <circle cx="35" cy="31" r="3" fill="#1a0a00"/>
            <circle cx="22" cy="30" r="1" fill="#fff"/>
            <circle cx="36" cy="30" r="1" fill="#fff"/>
            <ellipse cx="27" cy="38" rx="5" ry="3.5" fill="#E57373"/>
            <circle cx="25" cy="38" r="1.2" fill="#b71c1c"/>
            <circle cx="29" cy="38" r="1.2" fill="#b71c1c"/>
            <path d="M21 42 Q27 47 33 42" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <ellipse cx="9" cy="22" rx="6" ry="8" fill="#7B4F2A"/>
            <ellipse cx="9" cy="22" rx="3.5" ry="5" fill="#E57373"/>
            <ellipse cx="45" cy="22" rx="6" ry="8" fill="#7B4F2A"/>
            <ellipse cx="45" cy="22" rx="3.5" ry="5" fill="#E57373"/>
            <ellipse cx="10" cy="74" rx="5" ry="3" fill="#6D4C2E"/>
            <ellipse cx="44" cy="74" rx="5" ry="3" fill="#6D4C2E"/>
            <path d="M7 72 Q5 68 4 65" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M10 73 Q10 68 10 64" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M13 72 Q15 68 16 65" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M41 72 Q39 68 38 65" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M44 73 Q44 68 44 64" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M47 72 Q49 68 50 65" stroke="#5D2E0C" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="hole-opening"></div>
      <div class="dirt-mound"></div>
      <div class="dirt-top"></div>
      <div class="hit-flash" id="flash-${i}"></div>
    </div>
  </div>`;
}

// --- Leaderboard Functions ---
function getLeaderboard() {
  return JSON.parse(localStorage.getItem('wam_leaderboard')) || [];
}

function saveAndDisplayLeaderboard() {
  let lb = getLeaderboard();
  const hitRate = totalClicks > 0 ? Math.round((totalHits / totalClicks) * 100) : 0;
  
  // Push current score
  lb.push({ name: playerName, score: score, hitRate: hitRate });
  
  // Sort and keep top 5
  lb.sort((a, b) => b.score - a.score);
  lb = lb.slice(0, 5);
  
  localStorage.setItem('wam_leaderboard', JSON.stringify(lb));
  
  // Render HTML
  let html = '';
  lb.forEach((entry, idx) => {
    html += `<div class="lb-row"><span>${idx+1}. ${entry.name}</span> <span>${entry.score} pts (${entry.hitRate}%)</span></div>`;
  });
  
  document.getElementById('start-lb-rows').innerHTML = html;
  document.getElementById('end-lb-rows').innerHTML = html;
}

// --- Event Listeners ---
document.querySelectorAll('.hole-scene').forEach((scene, i) => {
  scene.addEventListener('mousedown', e => hitMole(i, e));
  scene.addEventListener('touchstart', e => { e.preventDefault(); hitMole(i, e.touches[0]); });
});

// Track misses and total clicks globally
document.addEventListener('mousedown', e => {
  if (!playing) return;
  totalClicks++; // Count every click during the game
  updateHitRate();
  
  if (!e.target.closest('.hole-scene')) showMiss(e.clientX, e.clientY);
});

// Hammer cursor
const hammer = document.getElementById('hammer-cursor');
document.addEventListener('mousemove', e => { hammer.style.left = e.clientX + 'px'; hammer.style.top = e.clientY + 'px'; });
document.addEventListener('mousedown', () => { hammer.classList.add('strike'); setTimeout(() => hammer.classList.remove('strike'), 150); });

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    difficulty = btn.dataset.diff;
  });
});

// Set initial name if exists
document.getElementById('player-name').value = playerName;

// Start / replay
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('replay-btn').addEventListener('click', () => {
  document.getElementById('end-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
});

function startGame() {
  playerName = document.getElementById('player-name').value.trim() || 'Player';
  localStorage.setItem('wam_name', playerName); // Save name for next time
  
  document.getElementById('start-screen').style.display = 'none';
  score = 0; combo = 0; maxCombo = 0; totalClicks = 0; totalHits = 0; timeLeft = GAME_DURATION;
  updateScore(); updateTime(); updateHitRate();
  playing = true;
  document.body.classList.add('playing');
  hammer.style.display = 'block';

  clearAllMoles();

  const cfg = DIFF[difficulty];
  moleInterval = setInterval(spawnMole, cfg.interval);

  tickInterval = setInterval(() => {
    timeLeft--;
    updateTime();
    const pct = timeLeft / GAME_DURATION * 100;
    document.getElementById('timer-bar').style.width = pct + '%';
    if (pct < 30) document.getElementById('timer-bar').style.background = 'linear-gradient(90deg,#E53935,#FF8C00)';
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  playing = false;
  document.body.classList.remove('playing');
  hammer.style.display = 'none';
  clearInterval(tickInterval);
  clearInterval(moleInterval);
  clearAllMoles();

  const hitRate = totalClicks > 0 ? Math.round((totalHits / totalClicks) * 100) : 0;

  document.getElementById('end-player-name').textContent = `Great game, ${playerName}!`;
  document.getElementById('end-title').textContent = score >= 200 ? '🎉 Legendary!' : score >= 100 ? '🔥 Amazing!' : '⏰ Time\'s Up!';
  document.getElementById('end-score').textContent = score;
  document.getElementById('end-hitrate').textContent = hitRate + '%';
  document.getElementById('end-combo').textContent = maxCombo + 'x';

  saveAndDisplayLeaderboard();
  document.getElementById('end-screen').style.display = 'flex';
}

function spawnMole() {
  if (!playing) return;
  const cfg = DIFF[difficulty];
  const available = [];
  for (let i = 0; i < HOLE_COUNT; i++) {
    const m = document.getElementById('mole-' + i);
    if (!m.classList.contains('up')) available.push(i);
  }
  if (available.length === 0) return;
  
  const idx = available[Math.floor(Math.random() * available.length)];
  const mole = document.getElementById('mole-' + idx);
  mole.classList.remove('whacked');
  mole.classList.add('up');

  const upTime = cfg.minUp + Math.random() * (cfg.maxUp - cfg.minUp);
  const t = setTimeout(() => { mole.classList.remove('up'); }, upTime);
  moleTimers.push(t);
}

function hitMole(i, e) {
  if (!playing) return;
  const mole = document.getElementById('mole-' + i);
  if (!mole.classList.contains('up')) return;

  mole.classList.remove('up');
  mole.classList.add('whacked');
  setTimeout(() => mole.classList.remove('whacked'), 200);

  totalHits++; // Track hits
  const cfg = DIFF[difficulty];
  combo++;
  if(combo > maxCombo) maxCombo = combo; // Track max combo
  
  clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => { combo = 0; }, 1200);
  
  const pts = cfg.points + (combo > 1 ? (combo-1)*5 : 0);
  score += pts;
  updateScore(); updateHitRate();

  // Flash
  const flash = document.getElementById('flash-' + i);
  flash.classList.remove('flash');
  void flash.offsetWidth;
  flash.classList.add('flash');

  // Burst label
  const wrap = document.getElementById('hole-wrap-' + i);
  const burst = document.createElement('div');
  burst.className = 'star-burst';
  burst.textContent = combo > 2 ? `x${combo} COMBO!` : `+${pts}`;
  wrap.appendChild(burst);
  setTimeout(() => burst.remove(), 600);

  showFloatingScore(e.clientX, e.clientY, pts);

  if (combo > 1) {
    const cd = document.getElementById('combo-display');
    cd.textContent = `🔥 ${combo}x Combo!`;
    cd.classList.add('show');
    clearTimeout(cd._t);
    cd._t = setTimeout(() => cd.classList.remove('show'), 900);
  }
}

function showFloatingScore(x, y, pts) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = '+' + pts;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

function showMiss(x, y) {
  document.body.classList.remove('shake');
  void document.body.offsetWidth;
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 300);

  const rip = document.createElement('div');
  rip.className = 'miss-ripple';
  rip.style.left = x + 'px'; rip.style.top = y + 'px';
  document.body.appendChild(rip);
  setTimeout(() => rip.remove(), 450);
}

function clearAllMoles() {
  moleTimers.forEach(clearTimeout);
  moleTimers = [];
  for (let i = 0; i < HOLE_COUNT; i++) {
    const m = document.getElementById('mole-' + i);
    m.classList.remove('up', 'whacked');
  }
}

function updateScore() {
  const el = document.getElementById('score-display');
  el.textContent = score;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

function updateTime() {
  const el = document.getElementById('time-display');
  el.textContent = timeLeft;
  el.style.color = timeLeft <= 5 ? '#E53935' : '#4E2800';
}

function updateHitRate() {
  const rate = totalClicks > 0 ? Math.round((totalHits / totalClicks) * 100) : 0;
  document.getElementById('hitrate-display').textContent = rate + '%';
}

// Initialize
saveAndDisplayLeaderboard();
document.getElementById('timer-bar').style.width = '100%';
</script>
</body>
</html>
